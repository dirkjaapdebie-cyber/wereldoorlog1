<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WOI Musea & Frontlinies - Binnen 1 uur van Abbeville</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f4f9;
    }
    h1 {
      margin-top: 0;
      color: #333;
    }
    #map {
      height: 600px;
      width: 100%;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }
    .legend {
      background: white;
      padding: 10px 15px;
      line-height: 24px;
      border-radius: 5px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }
    .legend i {
      width: 12px;
      height: 12px;
      float: left;
      margin-right: 8px;
      margin-top: 6px;
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <h1>WOI Musea binnen 1 uur rijden vanaf Abbeville</h1>
  <p>Klik op de rode markers voor WOI-musea en monumenten binnen ~1 uur rijden. De blauwe markers geven overige sleutellocaties aan het Westelijk Front weer.</p>
  
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    // 1. Initialiseer de kaart gecentreerd tussen Abbeville en het Somme-slagveld
    var map = L.map('map').setView([50.05, 2.2], 9);

    // 2. OpenStreetMap tegel-laag toevoegen
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    // Custom Icoontjes (Rood voor musea < 1u van Abbeville, Groen voor Abbeville zelf)
    var redIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    var greenIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    // Startpunt: Abbeville
    L.marker([50.1058, 1.8347], {icon: greenIcon}).addTo(map)
      .bindPopup("<b>Abbeville</b><br>Vertrekpunt / Basis");

    // 3. Musea & Herdenkingslocaties binnen ~1 uur rijden vanaf Abbeville (Rode markers)
    var nearbyMuseums = [
      {
        name: "Museum Somme 1916 (Albert)",
        lat: 50.0031,
        lng: 2.6483,
        driveTime: "ca. 50 min",
        desc: "Ondergronds museum in een tunnelcomplex onder de basiliek. Focus op de loopgravenstijd."
      },
      {
        name: "Beaumont-Hamel Newfoundland Memorial",
        lat: 50.0736,
        lng: 2.6481,
        driveTime: "ca. 55 min",
        desc: "Zeer goed bewaard gebleven loopgraventerrein, bezoekerscentrum en brons kariboemonument."
      },
      {
        name: "Thiepval Memorial & Bezoekerscentrum",
        lat: 50.0506,
        lng: 2.6856,
        driveTime: "ca. 55 min",
        desc: "Grootste Britse oorlogsmonument ter wereld met 72.000 namen van vermisten."
      },
      {
        name: "Lochnagar Crater (Ovillers-la-Boisselle)",
        lat: 50.0156,
        lng: 2.6972,
        driveTime: "ca. 55 min",
        desc: "Enorme mijnkrater ontstaan op 1 juli 1916 door een ondergrondse ontploffing."
      },
      {
        name: "Historial de la Grande Guerre (Péronne)",
        lat: 49.9292,
        lng: 2.9322,
        driveTime: "ca. 1 uur (via A29)",
        desc: "Toonaangevend internationaal museum in het kasteel van Péronne."
      }
    ];

    // Voeg de nabije musea toe
    nearbyMuseums.forEach(function(place) {
      L.marker([place.lat, place.lng], {icon: redIcon}).addTo(map)
        .bindPopup("<b>" + place.name + "</b><br><b>Rijtijd vanaf Abbeville:</b> " + place.driveTime + "<br><br>" + place.desc);
    });

    // 4. Overige locaties aan het Westelijk Front uit het overzicht (Standaard blauwe markers)
    var otherFrontLocations = [
      { name: "Nieuwpoort (IJzermonding)", lat: 51.1492, lng: 2.7214, desc: "Belgische sector: Onderwaterzetting IJzerpolders." },
      { name: "Diksmuide (Dodengang)", lat: 51.0333, lng: 2.8667, desc: "Belgische sector: Bewaarde Belgische loopgraven." },
      { name: "Ieper (In Flanders Fields Museum)", lat: 50.8511, lng: 2.8858, desc: "Britse sector: Bekende Ypres Salient." },
      { name: "Vimy Ridge (Canadees Monument)", lat: 50.3794, lng: 2.7736, desc: "Britse sector: Strategische hoogte heroverd door Canadezen." },
      { name: "Arras (Carrière Wellington)", lat: 50.2833, lng: 2.7778, desc: "Britse sector: Ondergronds tunnelnetwerk." },
      { name: "Chemin des Dames (Caverne du Dragon)", lat: 49.4422, lng: 3.7275, desc: "Franse sector: Strategisch kalksteenplateau." },
      { name: "Verdun (Mémorial de Verdun)", lat: 49.2011, lng: 5.4339, desc: "Franse sector: Centrum van de uitputtingsslag in 1916." }
    ];

    otherFrontLocations.forEach(function(place) {
      L.marker([place.lat, place.lng]).addTo(map)
        .bindPopup("<b>" + place.name + "</b><br>" + place.desc);
    });

    // 5. Legenda toevoegen
    var legend = L.control({position: 'bottomright'});
    legend.onAdd = function (map) {
      var div = L.DomUtil.create('div', 'legend');
      div.innerHTML += '<b>Legenda</b><br>';
      div.innerHTML += '<i style="background: green;"></i> Abbeville (Startpunt)<br>';
      div.innerHTML += '<i style="background: red;"></i> Musea binnen ~1u rijden<br>';
      div.innerHTML += '<i style="background: #3388ff;"></i> Overige frontlocaties<br>';
      return div;
    };
    legend.addTo(map);
  </script>

</body>
</html>
