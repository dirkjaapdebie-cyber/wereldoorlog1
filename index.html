<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musea rondom Abbeville - Alle Thema's</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f4f9;
    }
    h1 {
      margin-top: 0;
      color: #1a202c;
    }
    #map {
      height: 650px;
      width: 100%;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }
    .legend {
      background: white;
      padding: 10px 15px;
      line-height: 24px;
      border-radius: 5px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      font-size: 13px;
    }
    .legend i {
      width: 12px;
      height: 12px;
      float: left;
      margin-right: 8px;
      margin-top: 6px;
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <h1>Musea binnen 1 uur van Abbeville (Alle Thema's)</h1>
  <p>Gebruik het menu rechtsboven om specifieke museumthema's (Natuur/Kust, Kunst/Literatuur of WOI Historie) in- of uit te schakelen.</p>
  
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    // 1. Basislagen
    var osmTile = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© OpenStreetMap'
    });

    var esriSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Satelliet'
    });

    // Initialiseer kaart
    var map = L.map('map', {
      center: [50.05, 2.1],
      zoom: 9,
      layers: [osmTile]
    });

    // Layer Groups voor de verschillende thema's
    var natureCoastLayer = L.layerGroup().addTo(map);
    var artCultureLayer = L.layerGroup().addTo(map);
    var ww1Layer = L.layerGroup().addTo(map);

    // Custom gekleurde icoontjes
    var greenIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
    });

    var violetIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-violet.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
    });

    var orangeIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-orange.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
    });

    var redIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
    });

    // Basis: Abbeville
    L.marker([50.1058, 1.8347], {icon: greenIcon}).addTo(map)
      .bindPopup("<b>Abbeville</b><br>Vertrekpunt / Basis");

    // A. NATUUR, KUST & AMBACHTEN (Paarse Markers)
    var natureCoastMuseums = [
      { name: "Maison de la Baie de Somme (Lanchères)", lat: 50.1833, lng: 1.5500, time: "~25 min", desc: "Natuur & Kust: Alles over de flora, fauna, zeehonden en estuariumdynamiek van de Somme-baai." },
      { name: "Musée Picarvie (Saint-Valery-sur-Somme)", lat: 50.1889, lng: 1.6292, time: "~20 min", desc: "Maritiem & Ambachten: Sfeervol gereconstrueerd 19e-eeuws Picaard vissersdorp." },
      { name: "Musée du Tréport (Le Tréport)", lat: 50.0612, lng: 1.3719, time: "~40 min", desc: "Kustleven: Visserij, zeebadcultuur en reddingswezen in een oude stadsgevangenis." }
    ];

    natureCoastMuseums.forEach(function(m) {
      L.marker([m.lat, m.lng], {icon: violetIcon}).addTo(natureCoastLayer)
        .bindPopup("<b>" + m.name + "</b><br><b>Rijtijd:</b> " + m.time + "<br><br>" + m.desc);
    });

    // B. KUNST, KASTEEL, LITERATUUR & TECHNIEK (Oranje Markers)
    var artCultureMuseums = [
      { name: "Musée Boucher de Perthes / Beffroi (Abbeville)", lat: 50.1081, lng: 1.8314, time: "~5 min", desc: "Kunst & Prehistorie: Lokale archeologie, prehistorische vondsten en schone kunsten." },
      { name: "Château d'Eu - Musée Louis-Philippe (Eu)", lat: 50.0486, lng: 1.4189, time: "~35 min", desc: "Kasteel & Historie: Renaissancekasteel van koning Louis-Philippe met origineel interieur en tuinen." },
      { name: "Maison de Jules Verne (Amiens)", lat: 49.8892, lng: 2.3028, time: "~45 min", desc: "Literatuur: Woonhuis en werkkamer van de beroemde avonturen- en sciencefictionschrijver." },
      { name: "Musée de Picardie (Amiens)", lat: 49.8906, lng: 2.2961, time: "~45 min", desc: "Klassieke Kunst: 'Het kleine Louvre van het Noorden' met archeologie en grote meesters." },
      { name: "Musée Caudron (Rue)", lat: 50.2722, lng: 1.6681, time: "~25 min", desc: "Luchtvaart & Techniek: Gewijd aan de gebroeders Caudron, pioniers van de Franse luchtvaart." }
    ];

    artCultureMuseums.forEach(function(m) {
      L.marker([m.lat, m.lng], {icon: orangeIcon}).addTo(artCultureLayer)
        .bindPopup("<b>" + m.name + "</b><br><b>Rijtijd:</b> " + m.time + "<br><br>" + m.desc);
    });

    // C. WOI HISTORIE & MEMORIALS (Rode Markers)
    var ww1Museums = [
      { name: "Museum Somme 1916 (Albert)", lat: 50.0031, lng: 2.6483, time: "~50 min", desc: "WOI Historie: 230m ondergronds tunnelcomplex met diorama's van het loopgravenleven." },
      { name: "Beaumont-Hamel Newfoundland Memorial", lat: 50.0736, lng: 2.6481, time: "~55 min", desc: "WOI Historie: Uitzonderlijk bewaard slagveld en origineel loopgravensysteem." },
      { name: "Thiepval Memorial & Bezoekerscentrum", lat: 50.0506, lng: 2.6856, time: "~55 min", desc: "WOI Historie: Grootste Britse oorlogsmonument ter wereld met 72.000 namen." },
      { name: "Lochnagar Crater (Ovillers-la-Boisselle)", lat: 50.0156, lng: 2.6972, time: "~55 min", desc: "WOI Historie: Gigantische mijnkrater ontstaan op 1 juli 1916." },
      { name: "Historial de la Grande Guerre (Péronne)", lat: 49.9292, lng: 2.9322, time: "~1 uur", desc: "WOI Historie: Toonaangevend internationaal museum in het kasteel van Péronne." }
    ];

    ww1Museums.forEach(function(m) {
      L.marker([m.lat, m.lng], {icon: redIcon}).addTo(ww1Layer)
        .bindPopup("<b>" + m.name + "</b><br><b>Rijtijd:</b> " + m.time + "<br><br>" + m.desc);
    });

    // 4. Lagen-besturing (Layer Control)
    var baseMaps = {
      "OpenStreetMap": osmTile,
      "Satelliet": esriSat
    };

    var overlayMaps = {
      "Natuur, Kust & Ambachten": natureCoastLayer,
      "Kunst, Kasteel, Literatuur & Techniek": artCultureLayer,
      "WOI Historie & Memorials": ww1Layer
    };

    L.control.layers(baseMaps, overlayMaps, {collapsed: false}).addTo(map);

    // 5. Legenda
    var legend = L.control({position: 'bottomright'});
    legend.onAdd = function (map) {
      var div = L.DomUtil.create('div', 'legend');
      div.innerHTML += '<b>Thema Legenda</b><br>';
      div.innerHTML += '<i style="background: green;"></i> Abbeville (Basis)<br>';
      div.innerHTML += '<i style="background: #9c27b0;"></i> Natuur, Kust & Ambacht<br>';
      div.innerHTML += '<i style="background: #ff9800;"></i> Kunst, Kasteel, Literatuur & Techniek<br>';
      div.innerHTML += '<i style="background: #f44336;"></i> WOI Historie<br>';
      return div;
    };
    legend.addTo(map);
  </script>

</body>
</html>
